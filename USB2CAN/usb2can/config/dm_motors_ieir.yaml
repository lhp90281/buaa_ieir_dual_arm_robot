# =============================================================================
#  DM 电机限幅配置 — dm_motor_bridge (ieir 双臂 dual_arm_robot)
# =============================================================================
#
# 用途:
#   ieir 项目双 7-DoF 主臂 + 双 gripper 的 ch1/ch2 槽位映射.
#
# 槽位 / 关节 / 电机型号 (与 real-hardware-bringup 计划 §3.1 一致):
#   ch1.id0..6 = left_joint_0..6
#   ch1.id7    = left_gripper_right_finger_joint  (prismatic, 由 4310 + 齿条驱动)
#   ch2.id0..6 = right_joint_0..6
#   ch2.id7    = right_gripper_right_finger_joint
#   ch3        = (空)
#
# *_max 值来源: 用 DM 官方上位机逐颗电机读 flash 寄存器 (PMAX/VMAX/TMAX).
# 上下位机 x_max 必须一致, 否则 MIT 编解码错位 (README §9.6).
# =============================================================================

dm_motor_bridge:
  ros__parameters:

    # ---------- 聚合下发速率 ----------
    # /motor/chN/cmd 的多个发布者 (arm hw_interface + gripper_controller) 会被
    # bridge 缓存并按这个频率聚合, 然后 1:1 出到 /dcu/command. STM32 是 cmd-driven
    # feedback (收一帧下行才回一帧上行), 所以这个值就是 /dcu/feedback / /motor/chN/state
    # 的实际频率. 必须 >= controller_manager 的 update_rate, 否则上层控制环会被卡帧.
    publish_rate_hz: 350.0

    # ---------- 全局默认 (空槽位 / 未列出的电机用这套) ----------
    pos_max: 12.5
    vel_max: 30.0
    tor_max: 10.0
    kp_max:  500.0
    kd_max:  5.0

    # ---------- 通道总开关 ----------
    enable_ch1: true
    enable_ch2: true
    enable_ch3: true

    # ---------- 启动时通道使能 ----------
    default_enable_ch1: true
    default_enable_ch2: true
    default_enable_ch3: true

    # ---------- Per-motor 配置: 左臂 (ch1) ----------
    ch1:
      id0:                      # left_joint_0
        type: "DM8009"
        pos_max: 12.5
        vel_max: 45.0
        tor_max: 54.0
      id1:                      # left_joint_1
        type: "DM8009"
        pos_max: 12.5
        vel_max: 45.0
        tor_max: 54.0
      id2:                      # left_joint_2
        type: "DM4340P"
        pos_max: 12.5
        vel_max: 20.0
        tor_max: 28.0
      id3:                      # left_joint_3
        type: "DM4340"
        pos_max: 12.5
        vel_max: 20.0
        tor_max: 28.0
      id4:                      # left_joint_4
        type: "DM4310"
        pos_max: 12.5
        vel_max: 50.0
        tor_max: 10.0
      id5:                      # left_joint_5
        type: "DM4310"
        pos_max: 12.5
        vel_max: 50.0
        tor_max: 10.0
      id6:                      # left_joint_6
        type: "DM4310"
        pos_max: 12.5
        vel_max: 50.0
        tor_max: 10.0
      id7:                      # left_gripper_right_finger_joint (DM4310 + 齿条)
        type: "DM4310"
        pos_max: 12.5
        vel_max: 50.0
        tor_max: 10.0

    # ---------- Per-motor 配置: 右臂 (ch2) ----------
    ch2:
      id0:                      # right_joint_0
        type: "DM8009"
        pos_max: 12.5
        vel_max: 45.0
        tor_max: 54.0
      id1:                      # right_joint_1
        type: "DM8009"
        pos_max: 12.5
        vel_max: 45.0
        tor_max: 54.0
      id2:                      # right_joint_2
        type: "DM4340P"
        pos_max: 12.5
        vel_max: 20.0
        tor_max: 28.0
      id3:                      # right_joint_3
        type: "DM4340"
        pos_max: 12.5
        vel_max: 20.0
        tor_max: 28.0
      id4:                      # right_joint_4
        type: "DM4310"
        pos_max: 12.5
        vel_max: 50.0
        tor_max: 10.0
      id5:                      # right_joint_5
        type: "DM4310"
        pos_max: 12.5
        vel_max: 50.0
        tor_max: 10.0
      id6:                      # right_joint_6
        type: "DM4310"
        pos_max: 12.5
        vel_max: 50.0
        tor_max: 10.0
      id7:                      # right_gripper_right_finger_joint
        type: "DM4310"
        pos_max: 12.5
        vel_max: 50.0
        tor_max: 10.0
