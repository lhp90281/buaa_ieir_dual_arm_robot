# ============================================================================
# ros2_control controller configuration for the dual 7-DoF arm (ieir).
#
# Companion to dual_arm_ros2_control.urdf.xacro / dual_arm.launch.py.
#
# Active controllers:
#   - joint_state_broadcaster              (always on)
#   - gravity_compensation_controller      (default activated; covers BOTH arms)
#   - joint_position_controller            (loaded inactive; activate to PD-track)
#   - cartesian_position_controller        (loaded inactive)
#
# Grippers are intentionally not exposed here; their motors stay under the
# default dm_motor_bridge / external scripts.
# ============================================================================

controller_manager:
  ros__parameters:
    update_rate: 300  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    gravity_compensation_controller:
      type: ieir_controllers/GravityCompensationController

    joint_position_controller:
      type: ieir_controllers/JointPositionController

    cartesian_position_controller:
      type: ieir_controllers/CartesianPositionControllerPlugin

# ----------------------------------------------------------------------------
# Gravity Compensation Controller (with friction compensation, BOTH arms)
# ----------------------------------------------------------------------------
gravity_compensation_controller:
  ros__parameters:
    joints:
      - left_joint_0
      - left_joint_1
      - left_joint_2
      - left_joint_3
      - left_joint_4
      - left_joint_5
      - left_joint_6
      - right_joint_0
      - right_joint_1
      - right_joint_2
      - right_joint_3
      - right_joint_4
      - right_joint_5
      - right_joint_6

    # Fallback effort limit (Nm) when URDF <limit effort=...> is missing.
    # Per-joint limits are still pulled from URDF when present, so this is
    # only a safety net.
    max_effort: 50.0

    velocity_filter_alpha: 0.98

    # ---- Per-joint gravity compensation scale ----
    # tau_total[i] = gravity_gains[i] * tau_gravity[i] + tau_friction[i]
    # Use this to compensate for inaccuracies in the URDF inertial/mass model:
    #   >1.0  -> compensate more (URDF mass under-estimated, joint sags
    #            under gravity);
    #   <1.0  -> compensate less (URDF mass over-estimated, joint lifts
    #            up against gravity);
    #   =1.0  -> trust URDF as-is (original behavior).
    # Length MUST equal len(joints); order MUST match 'joints' above.
    # Tip: bump shoulder-pitch joints first (left/right_joint_1) -- they
    #      carry the most mass and are most sensitive to model error.
    gravity_gains:
      - 1.15   # left_joint_0
      - 1.15   # left_joint_1   (shoulder pitch, bump first if it sags)
      - 1.0   # left_joint_2
      - 1.0   # left_joint_3
      - 1.0   # left_joint_4
      - 1.0   # left_joint_5
      - 1.2   # left_joint_6
      - 1.15   # right_joint_0
      - 1.15   # right_joint_1  (shoulder pitch, bump first if it sags)
      - 1.0   # right_joint_2
      - 1.0   # right_joint_3
      - 1.0   # right_joint_4
      - 1.0   # right_joint_5
      - 1.1   # right_joint_6

    # ---- Friction compensation ----
    # Reuses friction_model.yaml identified on the small arm; same motor
    # families, parameters generalize across instances of the same family.
    friction_compensation_enabled: true
    # Runtime launch files override this with an absolute path resolved from
    # friction_model_yaml:=...; keep the checked-in default portable.
    friction_model_yaml: "friction_model.yaml"
    # motor_types must be in the same order as 'joints' above.
    motor_types:
      - DM8009     # left_joint_0
      - DM8009     # left_joint_1
      - DM4340P    # left_joint_2
      - DM4340     # left_joint_3
      - DM4310     # left_joint_4
      - DM4310     # left_joint_5
      - DM4310     # left_joint_6
      - DM8009     # right_joint_0
      - DM8009     # right_joint_1
      - DM4340P    # right_joint_2
      - DM4340     # right_joint_3
      - DM4310     # right_joint_4
      - DM4310     # right_joint_5
      - DM4310     # right_joint_6

    # Per-joint friction compensation gain. Length MUST equal len(joints);
    # order MUST match 'joints' above. Use this when one joint has
    # different mechanical drag than others (e.g. cable routing, harmonic
    # backlash) and you want to tune them independently. >1.0 is positive
    # feedback through the viscous term and can self-excite -- raise
    # carefully, one joint at a time, watching for oscillation.
    # Set the array to [] (or delete it) to fall back to the scalar
    # 'friction_gain' applied uniformly to every joint.
    friction_gains:
      - 0.7   # left_joint_0
      - 0.7   # left_joint_1
      - 0.85   # left_joint_2
      - 0.95   # left_joint_3
      - 0.8   # left_joint_4
      - 0.9   # left_joint_5
      - 0.5   # left_joint_6
      - 0.7   # right_joint_0
      - 0.7   # right_joint_1
      - 0.85   # right_joint_2
      - 0.95   # right_joint_3
      - 0.8   # right_joint_4
      - 0.8   # right_joint_5
      - 0.5   # right_joint_6

    # friction_gains:
    #   - 0.0   # left_joint_0
    #   - 0.0   # left_joint_1
    #   - 0.0   # left_joint_2
    #   - 0.0   # left_joint_3
    #   - 0.0   # left_joint_4
    #   - 0.0   # left_joint_5
    #   - 0.0   # left_joint_6
    #   - 0.0   # right_joint_0
    #   - 0.0   # right_joint_1
    #   - 0.0   # right_joint_2
    #   - 0.0   # right_joint_3
    #   - 0.0   # right_joint_4
    #   - 0.0   # right_joint_5
    #   - 0.0   # right_joint_6

    # Scalar fallback (used only when friction_gains above is empty / unset).
    friction_gain: 0.7
    friction_deadband: 0.05

# ----------------------------------------------------------------------------
# Joint Position Controller (DM MIT-mode joint PD via motor)
#
# Coexists with gravity_compensation_controller. Each motor's MIT loop
# sums them:
#     tau_motor = kp[i]*(q_des - q) + kd[i]*(qdot_des - qdot)   <-- this controller
#               + tau_gravity + tau_friction                    <-- gravity controller
# i.e. gravity-compensated joint impedance.
#
# Tuning order:
#   1. Activate this controller (gravity already up). Joint should hold
#      its current pose -- no motion expected.
#   2. Send a tiny step setpoint (a few degrees off current) on the
#      command topic. The joint should track within ~1 sec, no overshoot.
#   3. If the joint feels mushy, raise kp_gains[i]. If it oscillates or
#      rings, raise kd_gains[i]. Tune one joint at a time.
#
# Reasonable starting points for DM motors (all units in motor raw frame):
#   DM8009  (large, shoulder/elbow): kp ~ 30-60,  kd ~ 1.0-2.0
#   DM4340P (medium):                kp ~ 15-30,  kd ~ 0.5-1.5
#   DM4340  (medium):                kp ~ 15-30,  kd ~ 0.5-1.5
#   DM4310  (small, wrist):          kp ~ 5-15,   kd ~ 0.2-0.8
# These are *defensive* defaults; raise as needed once you trust the loop.
# ----------------------------------------------------------------------------
joint_position_controller:
  ros__parameters:
    joints:
      - left_joint_0
      - left_joint_1
      - left_joint_2
      - left_joint_3
      - left_joint_4
      - left_joint_5
      - left_joint_6
      - right_joint_0
      - right_joint_1
      - right_joint_2
      - right_joint_3
      - right_joint_4
      - right_joint_5
      - right_joint_6

    # Stiffness (motor kp). Length MUST equal len(joints); same order.
    kp_gains:
      - 70.0  # left_joint_0   (DM8009)
      - 70.0   # left_joint_1   (DM8009)
      - 70.0   # left_joint_2   (DM4340P)
      - 60.0   # left_joint_3   (DM4340)
      - 10.0   # left_joint_4   (DM4310)
      - 10.0   # left_joint_5   (DM4310)
      - 10.0   # left_joint_6   (DM4310)
      - 70.0   # right_joint_0  (DM8009)
      - 70.0   # right_joint_1  (DM8009)
      - 70.0   # right_joint_2  (DM4340P)
      - 60.0   # right_joint_3  (DM4340)
      - 10.0   # right_joint_4  (DM4310)
      - 10.0   # right_joint_5  (DM4310)
      - 10.0   # right_joint_6  (DM4310)

    # Damping (motor kd). Length MUST equal len(joints); same order.
    kd_gains:
      - 2.75    # left_joint_0
      - 2.5   # left_joint_1
      - 2.0    # left_joint_2
      - 2.0    # left_joint_3
      - 0.7    # left_joint_4
      - 0.6    # left_joint_5
      - 0.5    # left_joint_6
      - 2.75    # right_joint_0
      - 2.5    # right_joint_1
      - 2.0    # right_joint_2
      - 2.0    # right_joint_3
      - 0.7    # right_joint_4
      - 0.6    # right_joint_5
      - 0.5    # right_joint_6

    # JointTrajectory topic the controller listens on. Send a
    # trajectory_msgs/JointTrajectory here; latest goal supersedes older.
    command_topic: "/joint_position_command"

# ----------------------------------------------------------------------------
# Cartesian Position Controller
#
# Receives target end-effector poses (geometry_msgs/PoseStamped) on
#   ~/left_target_pose  and  ~/right_target_pose
# solves Pinocchio damped-LS IK for the matching joint configuration,
# rate-limits each joint at `position_interpolation_speed`, and forwards
# the (pos, v_ff, kp, kd) tuple to the per-joint MIT-mode command
# interfaces. The DM motor itself runs the inner PD loop:
#     tau_motor = kp[i]*(q_des - q) + kd[i]*(qdot_des - qdot)
#               + tau_gravity (from gravity_compensation_controller via
#                              the separate effort interface)
# i.e. exact same handoff as joint_position_controller, just with the
# setpoint coming from Cartesian-space IK.
#
# Mutually exclusive with joint_position_controller (also writes the
# position / stiffness / damping interfaces). Designed to coexist with
# gravity_compensation_controller (which owns the effort interface).
#
# kp_gains / kd_gains intentionally MIRROR joint_position_controller's
# values so a Cartesian -> joint-space failover (or vice versa) is bumpless.
# ----------------------------------------------------------------------------
cartesian_position_controller:
  ros__parameters:
    joints:
      - left_joint_0
      - left_joint_1
      - left_joint_2
      - left_joint_3
      - left_joint_4
      - left_joint_5
      - left_joint_6
      - right_joint_0
      - right_joint_1
      - right_joint_2
      - right_joint_3
      - right_joint_4
      - right_joint_5
      - right_joint_6

    # Stiffness (motor kp). Length MUST equal len(joints); same order.
    # Mirror joint_position_controller above; tune there first, copy here.
    kp_gains:
      - 70.0   # left_joint_0   (DM8009)
      - 70.0   # left_joint_1   (DM8009)
      - 70.0   # left_joint_2   (DM4340P)
      - 60.0   # left_joint_3   (DM4340)
      - 10.0   # left_joint_4   (DM4310)
      - 10.0   # left_joint_5   (DM4310)
      - 10.0   # left_joint_6   (DM4310)
      - 70.0   # right_joint_0  (DM8009)
      - 70.0   # right_joint_1  (DM8009)
      - 70.0   # right_joint_2  (DM4340P)
      - 60.0   # right_joint_3  (DM4340)
      - 10.0   # right_joint_4  (DM4310)
      - 10.0   # right_joint_5  (DM4310)
      - 10.0   # right_joint_6  (DM4310)

    # Damping (motor kd). Length MUST equal len(joints); same order.
    kd_gains:
      - 2.75   # left_joint_0
      - 2.5    # left_joint_1
      - 2.0    # left_joint_2
      - 2.0    # left_joint_3
      - 0.7    # left_joint_4
      - 0.6    # left_joint_5
      - 0.5    # left_joint_6
      - 2.75   # right_joint_0
      - 2.5    # right_joint_1
      - 2.0    # right_joint_2
      - 2.0    # right_joint_3
      - 0.7    # right_joint_4
      - 0.6    # right_joint_5
      - 0.5    # right_joint_6

    left_ee_frame: "left_attachment_point"
    right_ee_frame: "right_attachment_point"

    # ---- IK solver knobs (Pinocchio damped-LS, see ieir_dynamics::solveIK)
    # ik_eps: target frame error in m / rad. 1e-4 = 0.1 mm / 0.006 deg, fine
    #         enough that the residual is below DM motor encoder resolution.
    # ik_damping: Levenberg-Marquardt damping; raise if the EE is near a
    #         singularity and IK reports non-convergence on a reachable goal.
    # ik_dt: step size for the integrator that walks q toward the goal.
    ik_max_iter: 100
    ik_eps: 1.0e-4
    ik_damping: 1.0e-3
    ik_dt: 1.0

    # Per-joint speed cap on the smoothed q_command_ that is actually sent
    # to the motors. Keeps the kp*(q_des - q) error bounded even if the
    # incoming target jumps a long way; with kp=70, a 1 rad/s ramp gives
    # at most ~70 Nm of "instantaneous restoring force" demand from the
    # motor, well within DM8009's torque envelope.
    position_interpolation_speed: 1.0

joint_state_broadcaster:
  ros__parameters: {}

