# Joint-position gains for bilateral teleoperation.
#
# These profiles are read by dual_arm.launch.py and copied into
# joint_position_controller.kp_gains / kd_gains before the controller is
# loaded. They are not passed to ros2_control as parameters directly.
#
# slave keeps the current production gains. master is intentionally softer so
# the operator arm does not feel locked by tiny master/slave tracking errors.

joints:
  - left_joint_0
  - left_joint_1
  - left_joint_2
  - left_joint_3
  - left_joint_4
  - left_joint_5
  - left_joint_6
  - right_joint_0
  - right_joint_1
  - right_joint_2
  - right_joint_3
  - right_joint_4
  - right_joint_5
  - right_joint_6

profiles:
  slave:
    kp_gains:
      - 70.0  # left_joint_0   (DM8009)
      - 70.0   # left_joint_1   (DM8009)
      - 70.0   # left_joint_2   (DM4340P)
      - 60.0   # left_joint_3   (DM4340)
      - 10.0   # left_joint_4   (DM4310)
      - 10.0   # left_joint_5   (DM4310)
      - 10.0   # left_joint_6   (DM4310)
      - 70.0   # right_joint_0  (DM8009)
      - 70.0   # right_joint_1  (DM8009)
      - 70.0   # right_joint_2  (DM4340P)
      - 60.0   # right_joint_3  (DM4340)
      - 10.0   # right_joint_4  (DM4310)
      - 10.0   # right_joint_5  (DM4310)
      - 10.0   # right_joint_6  (DM4310)

    # Damping (motor kd). Length MUST equal len(joints); same order.
    kd_gains:
      - 2.75    # left_joint_0
      - 2.5   # left_joint_1
      - 2.0    # left_joint_2
      - 2.0    # left_joint_3
      - 0.7    # left_joint_4
      - 0.6    # left_joint_5
      - 0.5    # left_joint_6
      - 2.75    # right_joint_0
      - 2.5    # right_joint_1
      - 2.0    # right_joint_2
      - 2.0    # right_joint_3
      - 0.7    # right_joint_4
      - 0.6    # right_joint_5
      - 0.5    # right_joint_6

  master:
    kp_gains:
      - 70.0  # left_joint_0   (DM8009)
      - 70.0   # left_joint_1   (DM8009)
      - 70.0   # left_joint_2   (DM4340P)
      - 60.0   # left_joint_3   (DM4340)
      - 10.0   # left_joint_4   (DM4310)
      - 10.0   # left_joint_5   (DM4310)
      - 10.0   # left_joint_6   (DM4310)
      - 70.0   # right_joint_0  (DM8009)
      - 70.0   # right_joint_1  (DM8009)
      - 70.0   # right_joint_2  (DM4340P)
      - 60.0   # right_joint_3  (DM4340)
      - 10.0   # right_joint_4  (DM4310)
      - 10.0   # right_joint_5  (DM4310)
      - 10.0   # right_joint_6  (DM4310)

    # Damping (motor kd). Length MUST equal len(joints); same order.
    kd_gains:
      - 2.75    # left_joint_0
      - 2.5   # left_joint_1
      - 2.0    # left_joint_2
      - 2.0    # left_joint_3
      - 0.7    # left_joint_4
      - 0.6    # left_joint_5
      - 0.5    # left_joint_6
      - 2.75    # right_joint_0
      - 2.5    # right_joint_1
      - 2.0    # right_joint_2
      - 2.0    # right_joint_3
      - 0.7    # right_joint_4
      - 0.6    # right_joint_5
      - 0.5    # right_joint_6
