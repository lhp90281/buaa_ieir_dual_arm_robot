mujoco_simulator:
  # Display/target-editor panel for the real robot. Physics is forced paused
  # in this mode; the MuJoCo model is used as an interactive visualization.
  modelFile: "package://ieir_simulation/mjcf/dual_arm_robot.xml"

  # Kept for compatibility with the normal simulator path. They are not used
  # when panelMode is mirror_real or target_editor.
  jointCommandsTopic: "/ctrl/command"
  jointGainsTopic: "/ctrl/gains"
  unPauseService: "/unpause_physics"

  # Overridden by IEIR_MUJOCO_PANEL_MODE from mujoco_panel.launch.py.
  panelMode: "target_editor"
  realJointStatesTopic: "/joint_states"
  trajectoryCommandTopic: "/joint_position_command"
  trajectoryDuration: 5.0

  initPauseFlag: true
  modelTableFlag: true
